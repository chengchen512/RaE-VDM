seed: 3407
run_name: raevdm_core_full_seed3407
output_dir: outputs/theory_v2

data:
  root: data/RLED
  split: train
  file_pattern: "**/*.h5"
  max_files: null
  clip_len: 7
  clip_stride: 1
  frame_step: 1
  event_bins: 5
  crop_size: [256, 256]
  random_crop: true
  random_flip: true
  keyframe_policy: endpoints
  keyframe_stride: 6
  contrast_threshold: 0.2
  val_every: 10
  event_cache_size: 16

model:
  in_channels: 1
  event_feature_channels: 48
  base_channels: 48
  channel_mult: [1, 2, 4]
  time_embed_dim: 192
  use_reliability: true
  use_observability: true
  reliability_cue_channels: 4
  event_gate_source: learned
  use_linear_condition: true
  use_flow_fusion: false
  use_occlusion_refinement: false

diffusion:
  timesteps: 1000
  sampling_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear

theory:
  enabled: true
  weighted_event_target: true
  detach_precision: false
  quiet_margin: 0.02

residual:
  residual_scale: 0.30
  residual_timestep: 0
  residual_tanh_temperature: 2.0
  event_gate_floor: 0.08
  event_gate_power: 0.50

loss:
  diffusion: 1.0
  reconstruction: 0.20
  event_physics: 0.15
  quiet: 0.05
  anchor: 0.20
  temporal: 0.02
  reliability_calibration: 0.02
  reliability_prior: 0.01
  charbonnier_eps: 0.001

train:
  training_mode: diffusion
  batch_size: 2
  num_workers: 8
  prefetch_factor: 4
  epochs: 120
  lr: 0.0002
  scheduler: cosine
  warmup_steps: 2000
  min_lr: 0.00002
  ema_decay: 0.9999
  weight_decay: 0.000001
  grad_clip: 1.0
  mixed_precision: true
  log_every: 50
  save_every: 2
  max_steps_per_epoch: null

eval:
  batch_size: 1
  num_workers: 4
  max_batches: 20
