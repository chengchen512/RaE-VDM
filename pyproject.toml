[project]
name = "raevdm-intensity"
version = "0.2.0"
description = "Reliability-aware event-guided video interpolation with degraded event streams."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.23",
  "h5py>=3.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "imageio>=2.31",
  "scikit-image>=0.21",
]

[project.scripts]
raevdm-train = "raevdm.train:main"
raevdm-infer = "raevdm.infer:main"
raevdm-evaluate = "raevdm.evaluate:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
perceptual = ["lpips>=0.1.4"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
