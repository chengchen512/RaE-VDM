seed: 3407
run_name: raevdm_stage_base
output_dir: outputs

data:
  root: data/RLED
  split: all
  file_pattern: "**/*.h5"
  max_files: null
  clip_len: 7
  clip_stride: 1
  event_bins: 5
  crop_size: [256, 256]
  random_crop: true
  random_flip: true
  keyframe_policy: endpoints
  keyframe_stride: 6
  contrast_threshold: 0.2
  val_every: 10
  event_cache_size: 16

model:
  in_channels: 1
  event_feature_channels: 48
  base_channels: 48
  channel_mult: [1, 2, 4]
  time_embed_dim: 192
  use_reliability: true
  use_observability: true

diffusion:
  timesteps: 1000
  sampling_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear

loss:
  diffusion: 1.0
  event_physics: 0.15
  quiet: 0.05
  anchor: 0.20
  temporal: 0.02
  reliability_calibration: 0.02
  reliability_prior: 0.01
  charbonnier_eps: 0.001

train:
  batch_size: 2
  num_workers: 8
  prefetch_factor: 4
  epochs: 120
  lr: 0.0002
  scheduler: cosine
  warmup_steps: 2000
  min_lr: 0.00002
  ema_decay: 0.9999
  weight_decay: 0.000001
  grad_clip: 1.0
  mixed_precision: true
  log_every: 50
  save_every: 2
  max_steps_per_epoch: null

eval:
  batch_size: 1
  num_workers: 4
  max_batches: 20
